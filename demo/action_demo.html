<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SO-100 simulator</title>
<style>
  :root{color-scheme:dark;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif}
  *{box-sizing:border-box}body{margin:0;background:#101514;color:#eef5ef}
  main{width:min(720px,calc(100dvh - 125px),100%);margin:auto;padding:12px}
  .stage{position:relative;aspect-ratio:1;background:#3c4840;border:2px solid #34443b;border-radius:14px;overflow:hidden}
  .stage.failed{border-color:#e18c7d}
  .stage.movable{cursor:crosshair;touch-action:manipulation}
  #move-marker{position:absolute;width:28px;height:28px;border:3px solid #c0ecc6;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;display:none;box-shadow:0 0 0 2px #102617}
  img{width:100%;height:100%;display:block}
  form{margin-top:12px}input[type=text]{width:100%;padding:14px 15px;border:1px solid #597363;border-radius:10px;background:#19231d;color:#fff;font:inherit}
  .controls{display:flex;align-items:center;gap:16px;margin-top:10px}
  button{min-width:150px;padding:13px 20px;border:0;border-radius:10px;background:#c0ecc6;color:#102617;font:inherit;font-weight:700;cursor:pointer}
  button:disabled{opacity:.65;cursor:wait}.speed{display:flex;align-items:center;gap:10px;flex:1;color:#b9c8bd;font-size:14px}
  input[type=range]{width:100%;accent-color:#c0ecc6}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  @media(max-width:480px){main{padding:8px}.controls{gap:10px}button{min-width:110px}}
</style></head><body><main>
  <div class="stage" id="stage"><img id="frame" alt="Live SO-100 tabletop simulator"><div id="move-marker"></div></div>
  <form id="form">
    <label class="sr-only" for="command">Command</label>
    <input id="command" type="text" maxlength="200" required spellcheck="false" placeholder="Tell the arm what to do" value="lift the red cube then move left then drop it">
    <div class="controls"><button id="run" type="submit">Run</button><label class="speed" for="speed">Speed<input id="speed" type="range" min="0.25" max="4" step="0.25" value="1"></label></div>
  </form>
  <div class="sr-only" id="status" role="status" aria-live="polite"></div>
</main><script>
const $=id=>document.getElementById(id);let current,busy=false,moving=false;
async function api(path,body={}){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
function idleLabel(s){return !s.history.length&&s.last_model_choice==='done'?'Model: done':'Run'}
function draw(s){current=s;$('frame').src=s.frame;$('stage').className='stage'+(s.can_move_objects?' movable':'')+(s.history.length?(s.failed?' failed':s.finished?' done':''):'');$('status').textContent=s.status;$('run').title=s.status;$('run').textContent=busy?'Running…':idleLabel(s);const marker=$('move-marker');marker.style.display=s.move_uv?'block':'none';if(s.move_uv){marker.style.left=(s.move_uv[0]/512*100)+'%';marker.style.top=(s.move_uv[1]/512*100)+'%'}}
const pause=()=>new Promise(resolve=>setTimeout(resolve,600/Number($('speed').value)));
$('form').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;$('run').disabled=true;$('run').textContent='Running…';$('command').disabled=true;
  try{draw(await api('/api/command',{text:$('command').value}));
    for(let i=0;i<13&&current?.next_action;i++){draw(await api('/api/step'));if(current.failed||current.finished)break;await pause()}
  }catch(error){$('stage').className='stage failed';$('status').textContent=error.message}
  finally{busy=false;$('command').disabled=false;$('run').disabled=false;$('run').textContent=current?idleLabel(current):'Run'}
};
$('command').oninput=()=>{if(!busy)$('run').textContent='Run'};
$('stage').onclick=async e=>{if(!current?.can_move_objects||moving)return;const box=$('frame').getBoundingClientRect();moving=true;
  try{draw(await api('/api/move',{u:(e.clientX-box.left)/box.width*512,v:(e.clientY-box.top)/box.height*512}))}
  catch(error){$('status').textContent=error.message;$('stage').title=error.message}
  finally{moving=false}
};
fetch('/api/state').then(r=>r.json()).then(draw).catch(error=>$('status').textContent=error.message);
</script></body></html>
